# 自律ループ 02 実装フェーズ
#
# トリガ : Issue に `auto:approved` ラベルが付いた時（auto-01 の handoff ジョブが付ける）
# 担当   : テスト設計 → コーディング
# ゲート : **なし**（設計 §6 の表。ゲート1・2 は auto-01 で通過済み）
# 設計   : docs/自律開発ループ設計.md §3 #3/#4・§6・§8.1・§8.3・§11.6
#
# ── 前提 ──
#   足場（Next.js 雛形・Supabase スキーマ・Playwright 設定）が main にマージされていること。
#   設計 §9 フェーズ0-1・決定#3。足場が無い状態ではテストの実行基盤が存在しない。
#
# ── 責務の分界（auto-01 と同じ）──
#   エージェント = tests/ と実装コードの編集、最終メッセージとマーカーの出力
#   ワークフロー = コミット・push・PR 作成・ラベル遷移・エージェント出力の転記
#   auto-01 の試運転で「エージェントの編集がランナー内に留まって消える」不具合を踏んだため、
#   永続化は例外なく機械側に寄せる。

name: 自律ループ 02 実装

on:
  issues:
    types: [labeled]

# ⚠️ 2026-09-16 改訂: 全体直列化をやめ、**Issue 単位の並列**にする。
#
# ── 旧設定が何を壊していたか ──────────────────────────────────
# 旧: group: 'auto-implement'（Issue 番号を含まないリテラル）
# 意図は「実装フェーズを1本に直列化してマージ競合を避ける」ことだったが、
# GitHub の concurrency は **1グループにつき pending を1本しか保持しない**。
# `cancel-in-progress: false` が守るのは in-progress の run だけである。
#
# したがって3件目が `auto:approved` に到達すると、待機していた2件目の run が
# 黙って追い出される。ラベルの付け替えはジョブ**内部**で起きるため
# （下の「ラベルを auto:implementing に付け替え」ステップ）、追い出された Issue は
# `auto:approved` のまま、コメントもラベル変化も残さず永久に停止する。
# `blocked` ジョブ（needs.implement.result != 'success'）も発火しない。
#
# 実害: Issue #9 が 2026-09-03 から13日間 `auto:approved` で放置された。
# これは「オーナーの承認待ち」ではなく、**仕事が黙って落ちていた**状態である。
#
# ── 直列化の目的は別の手段で満たす ────────────────────────────
# マージ競合の回避は、直列化ではなく次の3点で担保する。
#   1. 1 Issue = 1 ブランチ = 1 PR（この命名規約は維持する）
#   2. auto-03 の squash merge は main 上で逐次に起きる。競合すれば CI が赤くなり
#      修正ループへ入るため、競合が黙って通ることはない
#   3. 払い出しは WBS の依存順（automation/scripts/wbs_epic.py の classify）に従うため、
#      同時に走る作業パッケージは原則として依存関係を持たない
#
# 空振り run の隔離（2026-09-13 の修正）は引き続き必要なので残す。
concurrency:
  group: >-
    ${{ github.event.label.name == 'auto:approved'
        && format('auto-implement-{0}', github.event.issue.number)
        || format('auto-implement-noop-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  # claude-code-action は OIDC トークンでの認証を必要とする。
  # auto-01 の試運転ではこれが欠落し「Could not fetch an OIDC token」で失敗した。
  id-token: write

env:
  MODEL: claude-opus-5
  OWNER: KoshiNakano1017

jobs:
  implement:
    if: github.event.label.name == 'auto:approved'
    runs-on: ubuntu-latest
    # 設計 §8.3「コーディングは timeout-minutes: 60 程度に明示的に絞る」。
    # テスト設計（〜30分）とコーディング（〜60分）を1ジョブに置くため合計 90 分。
    timeout-minutes: 90
    outputs:
      branch: ${{ steps.branch.outputs.name }}
      pr: ${{ steps.pr.outputs.number }}
      blocked: ${{ steps.orc-tests.outputs.blocked || steps.orc-code.outputs.blocked }}
      reason: ${{ steps.orc-tests.outputs.reason || steps.orc-code.outputs.reason }}
      blocked_kind: ${{ steps.orc-tests.outputs.blocked_kind || steps.orc-code.outputs.blocked_kind }}
    steps:
      # PAT で checkout する。以降の push がこの資格情報を使うため、
      # push イベントが ci.yml を起動する（GITHUB_TOKEN では起動しない・設計 §8.1）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT }}

      - name: 件名の🔴プレフィックスを外す（再開時の後始末・冪等）
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="$(gh issue view "$ISSUE" --repo "$REPO" --json title --jq .title)"
          STRIPPED="${TITLE#"🔴[要判断] "}"
          if [ "$STRIPPED" != "$TITLE" ]; then
            gh issue edit "$ISSUE" --repo "$REPO" --title "$STRIPPED"
          fi

      - name: ラベルを auto:implementing に付け替え
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "auto:approved" --add-label "auto:implementing"

      - name: ブランチを決める
        id: branch
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # CLAUDE.md §5.1 が列挙する短命ブランチのうち feature/* を使う。
          # 1 Issue = 1 ブランチ = 1 PR（設計 §10.6）。auto-03 は逆にこの命名から Issue 番号を引く。
          BRANCH="feature/issue-${ISSUE}"
          # 既に PR が開いているブランチを作り直すと、レビュー中の差分を消してしまう。
          EXISTING="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "::error::${BRANCH} には既に PR #${EXISTING} が開いています。実装をやり直すなら先に PR を閉じてください"
            exit 1
          fi
          git checkout -B "$BRANCH"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "ブランチ: ${BRANCH}"

      # ── テスト設計: 仕様だけを見て受入テストを先に書く（設計 §3 #3・§11.6）──
      # 書き込み範囲は tests/ のみ。settings/test.json で機械的に制限する（設計 §7.2）。
      # ── 段7（2026-09-13）: エージェント2体の直接起動を、
      #    実装オーケストレータ（automation/orchestrator/implement.mjs）へ置き換えた。
      #    旧版は claude-code-action を2回呼び、その出力を Issue コメントへ転記して
      #    `<!--tests:designed-->` / `<!--implemented-->` を grep していた。
      #    マーカーが空振りすると判定を読めず、verify も CI 一周でしか回せなかった。
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --omit=optional は付けない。Agent SDK は実行バイナリを
      # optionalDependencies で配るため、省くと起動できない。
      - name: 依存をインストール
        run: npm ci --no-audit --no-fund

      - name: エージェント定義と段取りの検査
        run: |
          python3 automation/scripts/check_agents.py
          python3 automation/scripts/check_stages.py

      # テスト設計だけを先に走らせる。実装と同じプロセスで回さないのは、
      # 受入テストを **単独のコミット** として git 履歴に残すため（設計 §11.6）。
      # テストの sha256 は automation/state/issue-<n>.json に残り、次の起動へ引き継がれる。
      - name: 実装オーケストレータ（テスト設計）
        id: orc-tests
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORC_MAX_TURNS: '40'
        run: node automation/orchestrator/implement.mjs --issue "${{ github.event.issue.number }}" --phase tests
      - name: 受入テストだけを先にコミットする
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CHANGED="$(git status --porcelain)"
          if [ -z "$CHANGED" ]; then
            echo "::error::テスト設計エージェントがファイルを1つも作っていません"
            exit 1
          fi
          # 設計 §3 #3 の書き込み範囲（tests/ のみ）を機械的にも確認する。
          # settings による制限との二重化（設計 §7.2 の考え方）。
          #
          # ⚠️ 2026-09-14 修正: automation/state/ を除外する。
          #   このガードは旧構成（claude-code-action を直接叩く）の前提で書かれており、
          #   「tests/ 以外の差分＝テスト設計エージェントの越境」と見なしてよかった。
          #   段7 で実装オーケストレータへ移行した結果、implement.mjs 自身が
          #   automation/state/issue-<n>.json を必ず書くようになり（設計 §6.3 の
          #   「再開は PR ＋ Issue ＋ state から復元できること」）、**正当な実装が
          #   必ずここで落ちる**ようになった。Issue #29 が実際にこれで停止した。
          #   state はエージェントの成果物ではなくオーケストレータの記録なので、
          #   越境判定の対象から外す。tests/ 以外の**コード**が混ざる検査は維持する。
          OUTSIDE="$(printf '%s\n' "$CHANGED" | sed 's/^...//' \
            | grep -v '^tests/' | grep -v '^automation/state/' || true)"
          if [ -n "$OUTSIDE" ]; then
            echo "::error::テスト設計が tests/ の外を変更しました（設計 §3 #3）"
            printf '%s\n' "$OUTSIDE"
            exit 1
          fi
          git add tests
          # state はオーケストレータの記録。次回起動が再開に使うため一緒に残す。
          git add automation/state 2>/dev/null || true
          git commit -F - <<'COMMIT_MSG'
          test: Issue #${{ github.event.issue.number }} の受入テストを追加する

          実装より先にテストを置き、完了条件を実行可能な形で固定する。
          生成側と評価側が同じモデルであることによる判定の汚染を防ぐ commit-first 構造。
          根拠: docs/自律開発ループ設計.md §3 #3・§11.6、Issue #${{ github.event.issue.number }}
          COMMIT_MSG

      # ── コーディング: 承認済みの段取りに従って実装し、先に置いたテストを通す ──
      # 実装と verify.sh のループを1プロセスで回す。
      # 型・lint・単体が赤いあいだは **ワークフローを一周させずに** 直させる
      # （設計 §12.1.8 #2：修正1回のコストをワークフロー1周からツール呼び出しへ）。
      # テストの sha256 照合と、Write によるテスト改変の拒否もこの中で効く。
      - name: 実装オーケストレータ（実装 → verify ループ）
        id: orc-code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORC_MAX_TURNS: '60'
        run: node automation/orchestrator/implement.mjs --issue "${{ github.event.issue.number }}" --phase code
      - name: 実装をコミットする
        run: |
          set -euo pipefail
          # 仕様書ガード（設計 §8.2）の前倒し。auto-03 でも検査するが、
          # ここで止めれば docs/spec/ の差分が public リポジトリへ push されずに済む。
          SPEC_CHANGED="$(git status --porcelain -- docs/spec | sed 's/^...//' || true)"
          if [ -n "$SPEC_CHANGED" ]; then
            echo "::error::自律ループは docs/spec/ を変更できません（設計 §0・§8.2）"
            printf '%s\n' "$SPEC_CHANGED"
            exit 1
          fi
          # commit-first の担保。先に確定させた受入テストが書き換えられていないことを確認する。
          TESTS_TOUCHED="$(git status --porcelain -- tests | sed 's/^...//' || true)"
          if [ -n "$TESTS_TOUCHED" ]; then
            echo "::error::コーディングが受入テストを変更しました。テストの書き換えは仕様変更にあたります（設計 §0・§11.6）"
            printf '%s\n' "$TESTS_TOUCHED"
            exit 1
          fi
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::コーディングエージェントが実装を1行も書いていません"
            exit 1
          fi
          git add -A
          git commit -F - <<'COMMIT_MSG'
          feat: Issue #${{ github.event.issue.number }} の実装

          承認済みの段取りに従って実装し、先に置いた受入テストを通す。
          根拠: Issue #${{ github.event.issue.number }} の段取りコメント、docs/自律開発ループ設計.md §3 #4
          COMMIT_MSG

      # ── WBS の進捗を反映する（設計 §10.1.5 導線5） ────────────────────────
      #   書くのは**スクリプト**であってエージェントではない。エージェントの settings は
      #   `Edit(docs/spec/**)` を deny したままで、権限を1つも広げずに進捗を反映できる。
      #   コード実装とは**別コミット**にする（CLAUDE.md §5.2）。
      #   マージ後ではなく PR 内で行うのは、ゲート3の差分レビューに出すため（設計 §10.1.5 導線5）。
      - name: WBS の進捗を更新する
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PKG="$(gh issue view "$ISSUE" --repo "$REPO" --json body --jq '.body' \
            | grep -oE '<!--wbs:[^>]+-->' | head -1 | sed -E 's/<!--wbs:(.*)-->/\1/' || true)"

          if [ -z "$PKG" ]; then
            # 導線1 を通さずに手で立てた Issue はマーカーを持たない。
            # **失敗させない。** WBS に対応する行が無いだけで、実装そのものは正当である。
            echo "::notice::Issue #${ISSUE} に <!--wbs:...--> が無いため WBS は更新しません"
            exit 0
          fi

          echo "WBS の進捗を更新する: ${PKG}"
          PYTHONIOENCODING=utf-8 python3 automation/scripts/wbs_update.py \
            --package "$PKG" --issue "$ISSUE"

          if git diff --quiet -- docs/spec/WBS_Phase1.md; then
            echo "::notice::WBS に変化なし（既に完了扱いでした）"
            exit 0
          fi

          git add docs/spec/WBS_Phase1.md
          git commit -F - <<COMMIT_MSG
          docs: WBS ${PKG} の進捗を完了にする (Issue #${ISSUE})

          実装のマージに伴う進捗の転記。実装 / 総合 / ステータスの3セルのみを更新している。
          根拠: docs/自律開発ループ設計.md §10.1.5 導線5、§0（進捗セルは禁止対象ではない）
          COMMIT_MSG

      - name: ブランチを push する
        run: |
          set -euo pipefail
          # PAT で checkout してあるため、この push は ci.yml を起動する（設計 §8.1）。
          git push -u origin "${{ steps.branch.outputs.name }}"

      - name: PR を作成する
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          # PR 本文とタイトルはコーディングエージェントが書く
          # （設計 §11.4 のトレーサビリティ表を含むため）。
          # 取り出せなかった場合でも PR 作成そのものは失敗させない。
          if [ ! -s /tmp/pr-body.md ]; then
            echo "::warning::/tmp/pr-body.md がありません。最小限の本文で PR を作成します"
            {
              echo "## 概要"
              echo
              echo "Issue #${ISSUE} の実装。"
              echo
              echo "Closes #${ISSUE}"
              echo
              echo "> [!WARNING]"
              echo "> コーディングエージェントが PR 本文を出力しませんでした。"
              echo "> 設計 §11.4 のトレーサビリティ表がありません。ゲート3で差分を直接確認してください。"
            } > /tmp/pr-body.md
          fi
          if [ -s /tmp/pr-title.txt ]; then
            TITLE="$(head -1 /tmp/pr-title.txt)"
          else
            echo "::warning::/tmp/pr-title.txt がありません。Issue タイトルから組み立てます"
            TITLE="feat: ${ISSUE_TITLE#\[auto\] }"
          fi
          # squash マージでこのタイトルが main のコミット件名になる（CLAUDE.md §5.2）。
          gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "$TITLE" --body-file /tmp/pr-body.md
          PR="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          echo "number=${PR}" >> "$GITHUB_OUTPUT"
          echo "PR #${PR} を作成しました"

      - name: ラベルを auto:review に付け替え
        env:
          # PAT でないと auto-03 が起動しない（設計 §8.1）。
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "auto:implementing" --add-label "auto:review"

  # ── 停止: 実装フェーズにゲートは無いので、失敗はすべてオーナーへ委ねる ──
  # ── 停止: 事由で行き先を分ける（2026-09-16 改訂）─────────────
  # spec         → auto:blocked  オーナー判断が要る。枯渇レポートに載る
  # infra/credit → auto:retry    スイーパーが時間をおいて自動再開する
  #
  # ⚠️ ジョブ失敗（ガードに引っかかった等）は blocked_kind が空になる。
  # その場合は再実行で直る可能性があるため auto:retry 側へ倒す。
  # 仕様の未確定はオーケストレータが必ず blocked_kind=spec を立てる。
  blocked:
    needs: implement
    if: always() && needs.implement.result != 'success' && needs.implement.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: 停止事由に応じてラベルを付け替え、通知する
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ needs.implement.outputs.reason }}
          KIND: ${{ needs.implement.outputs.blocked_kind }}
        run: |
          set -euo pipefail
          KIND="${KIND:-infra}"
          if [ "$KIND" = "spec" ]; then
            NEW_LABEL="auto:blocked"
          else
            NEW_LABEL="auto:retry"
          fi
          gh issue edit "$ISSUE" --repo "$REPO" \
            --remove-label "auto:implementing" --add-label "$NEW_LABEL" || true

          # 2026-09-25 新設: auto-01 と同じ規約（オーナー判断待ちだけ件名に🔴・冪等）
          if [ "$NEW_LABEL" = "auto:blocked" ]; then
            TITLE="$(gh issue view "$ISSUE" --repo "$REPO" --json title --jq .title)"
            case "$TITLE" in
              "🔴[要判断] "*) : ;;
              *) gh issue edit "$ISSUE" --repo "$REPO" --title "🔴[要判断] ${TITLE}" ;;
            esac
          fi

          if [ "$NEW_LABEL" = "auto:retry" ]; then
            cat > notice.md <<'EOF'
          ## ⏳ 実装フェーズが一時的な事由で停止しました

          仕様の問題ではありません。**オーナーの操作は不要です。**
          スイーパー（`auto-05-sweep.yml`）が時間をおいて自動で再開します。

          <!--retry:from=auto:approved-->
          EOF
            printf '\n事由: `%s`\n理由: %s\n実行: %s\n' \
              "$KIND" "${REASON:-ワークフローの失敗（実行ログを確認してください）}" "$RUN_URL" >> notice.md
          else
            printf '%s\n\n%s\n\n%s\n\n%s\n' \
              "@${OWNER} 実装フェーズが停止しました。**仕様が未確定のため、オーナーの判断が要ります。**" \
              "理由: ${REASON:-（理由の記録がありません）}" \
              "再開するには \`auto:blocked\` を外し、\`auto:approved\` を付け直してください。" \
              "実行: ${RUN_URL}" > notice.md
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body-file notice.md
