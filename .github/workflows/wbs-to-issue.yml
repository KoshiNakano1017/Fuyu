# WBS → Issue 生成（設計 §10.1.5 導線1）
#
# トリガ : 手動（workflow_dispatch）。作業パッケージ番号を渡す
# 担当   : 転記はスクリプト（決定論）。エージェントは「番号の特定」と「起草」だけを担う
# 設計   : docs/自律開発ループ設計.md §10.1.5「導線1: WBS → Issue 生成」
#
# ── 2026-09-13：入力が正しいのに起票できない不具合を修正した ──────────────
#   `wbs_to_issue.py` に表の取りこぼしが3件あり、WBS から正しくコピペしても
#   「見つかりません」または「タイトルが空・needs-spec」になっていた。
#     ① 区切り行 `--:`（ダッシュ2本）を区切り行と認識せず、`§0-1` と `§2` の表が
#        丸ごと消えていた（`2-1`〜`2-6` が起票不能）
#     ② 冒頭の §S-2 サマリー表を本体の表より先に拾い、列が合わず全項目が空になった
#        （0-1 / 1-1 / 1-2 / 1-3 / 7-1）
#     ③ `CLAUDE.md §4.4` 等の他ドキュメントの節を `v13 §4.4` として出力していた
#   **利用者の入力は最初から正しかった。** 修正の詳細はスクリプトの docstring を参照。
#
#   そのうえで、それでも一致しない入力に限り `wbs-resolve` エージェントが候補から
#   特定する（2026-09-13 オーナー決定）。エージェントが返した番号は**必ず
#   スクリプトへ渡し直して再検証する**ため、実在しない番号は通らない。
#
# ── このワークフローがやること / やらないこと ──
#   やる     : WBS_Phase1.md の1行を読み、Issue テンプレート5項目のうち
#              「目的・根拠となる仕様・想定サイズ」の3つを埋めて Issue を作る
#   やらない : 完了条件とスコープ外の考案（＝仕様判断。設計 §0 によりオーナーの専権事項）
#
#   WBS には検証可能な完了条件が書かれていない。ここを機械が埋めると
#   「起票の場で仕様を考える」ことになり、翌朝のゲート1（PM の解釈とオーナーの意図の
#   照合）が空回りする（設計 §10.1.3 の警告）。だから意図的に空欄で出す。
#
# ── `auto` ラベルを自動では付けない理由 ──
#   起票可能かの3条件（設計 §10.1.3）のうち、機械が判定できるのは2つだけ:
#     1. 節番号が引ける        → WBS から抽出できるので自動判定できる
#     2. ブロッカーが解けている → WBS のステータス欄で自動判定できる
#     3. 完了条件が検証可能    → **WBS に情報が無いので判定できない**
#   3を人が埋めない限り `auto` を付けてはいけないため、既定では無ラベルで作る。
#   `start_loop: true` を明示したときだけ `auto` を付けるが、1・2 が満たされない
#   場合はワークフロー側で拒否する。

name: WBS → Issue 生成

on:
  workflow_dispatch:
    inputs:
      package:
        description: "作業パッケージ番号（例: 3-5b / 1-2 / 0-1 / 14-6）。太字・全角・§・空白は自動で吸収する"
        required: true
        type: string
      resolve:
        description: "番号が一致しないとき、エージェントに候補から特定させる（既定: する）"
        required: false
        type: boolean
        default: true
      start_loop:
        description: "auto ラベルを付けて自律ループを即開始する（完了条件を自分で埋めてから使うこと）"
        required: false
        type: boolean
        default: false
      draft:
        description: "起票支援エージェントに完了条件とスコープ外を起草させる（既定: する）"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  # claude-code-action は OIDC トークンでの認証を必要とする（auto-01-plan.yml と同じ）
  id-token: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ── 段1: 決定論的に引く ────────────────────────────────────────
      # 表記ゆれ（`**0-1**` / 全角 / `§` / 空白 / ハイフン異体字）はスクリプト側の
      # normalize_id() が吸収する。ここで引けなければ本当に一致していない。
      - name: WBS から作業パッケージを読み出す
        id: wbs
        run: |
          set -uo pipefail
          PACKAGE='${{ inputs.package }}'

          if python3 automation/scripts/wbs_to_issue.py "$PACKAGE" > /tmp/issue.json 2>/tmp/wbs.err; then
            printf '%s' "$PACKAGE" > /tmp/package.txt
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "一致しました: $PACKAGE"
          else
            # exit 3。/tmp/issue.json には候補一覧が入っている（wbs-resolve が読む）
            cat /tmp/wbs.err
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::'${PACKAGE}' は WBS 上のどの作業パッケージとも一致しませんでした"
          fi

      # ── 段2: それでも一致しないときだけエージェントを呼ぶ ──────────────
      # 起票そのものはさせない（wbs-resolve.json に gh が無い）。決めるのは「どの行か」だけ。
      - name: 曖昧一致エージェント（WBS 番号の特定）
        id: resolver
        if: steps.wbs.outputs.found == 'false' && inputs.resolve
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--model claude-opus-5 --effort medium'
          settings: automation/settings/wbs-resolve.json
          prompt: |
            automation/agents/wbs-resolve.md を読み、その指示に従うこと。
            入力された番号: ${{ inputs.package }}
            候補一覧は /tmp/issue.json にある。

      # ── 段3: エージェントの答えを決定論的に再検証する ────────────────────
      # ここが要。エージェントは番号を1つ指すだけで、Issue の中身は必ず
      # スクリプトが WBS から作り直す。実在しない番号を返しても通らない。
      - name: 特定結果を取り込んで再検証する
        if: steps.wbs.outputs.found == 'false' && inputs.resolve
        run: |
          set -uo pipefail
          bash automation/scripts/post_agent_output.sh \
            "${{ steps.resolver.outputs.execution_file }}" none "" "" /tmp/resolve.md

          echo "── エージェントの回答 ──"
          cat /tmp/resolve.md || true
          echo "───────────────────"

          RESOLVED="$(grep -oE '^WBS_RESOLVED:[[:space:]]*[^[:space:]]+' /tmp/resolve.md \
                      | tail -1 | sed 's/^WBS_RESOLVED:[[:space:]]*//')"
          if [ -z "$RESOLVED" ]; then
            echo "::error::'${{ inputs.package }}' に対応する作業パッケージを特定できませんでした。上の回答にある指示のとおり入力し直してください"
            exit 1
          fi

          if ! python3 automation/scripts/wbs_to_issue.py "$RESOLVED" > /tmp/issue.json; then
            echo "::error::エージェントが返した '${RESOLVED}' も WBS に存在しません。入力し直してください"
            exit 1
          fi
          printf '%s' "$RESOLVED" > /tmp/package.txt
          echo "::warning::入力 '${{ inputs.package }}' を作業パッケージ '${RESOLVED}' として解釈しました"

      # エージェントを使わない設定で一致しなかった場合は、ここで素直に落とす。
      - name: 一致しなかった場合は停止する
        if: steps.wbs.outputs.found == 'false' && !inputs.resolve
        run: |
          echo "::error::'${{ inputs.package }}' は WBS に見つかりませんでした（resolve: false のため特定は行いません）"
          jq -r '.candidates[]? | "  候補: \(.id)  \(.name)  — \(.why)"' /tmp/issue.json || true
          exit 1

      # ── 段4: Issue 本文を組み立てる（常に決定論） ──────────────────────
      - name: Issue 本文を組み立てる
        id: issue
        run: |
          set -euo pipefail
          PACKAGE="$(cat /tmp/package.txt)"

          jq -r '.title'              /tmp/issue.json > /tmp/title.txt
          jq -r '.body'               /tmp/issue.json > /tmp/body.md
          jq -r '.labels | join(",")' /tmp/issue.json > /tmp/labels.txt

          # 入力と採用した番号が違う場合は、その事実を Issue 本文の先頭に残す。
          # 「なぜこの Issue が立ったのか」を後から追えるようにするため（設計 §2）。
          if [ "$PACKAGE" != '${{ inputs.package }}' ]; then
            {
              echo "> [!warning] 入力された番号は \`${{ inputs.package }}\` でした"
              echo "> WBS 上で一致しなかったため、\`wbs-resolve\` エージェントが **\`${PACKAGE}\`** と判断しました。"
              echo "> 違っていればこの Issue を閉じ、正しい番号で起票し直してください。"
              echo
              cat /tmp/body.md
            } > /tmp/body.tmp && mv /tmp/body.tmp /tmp/body.md
          fi

          {
            echo "package=${PACKAGE}"
            echo "blocked=$(jq -r '.blocked'    /tmp/issue.json)"
            echo "retired=$(jq -r '.retired'    /tmp/issue.json)"
            echo "spec_ref=$(jq -r '.spec_ref'  /tmp/issue.json)"
            echo "other_refs=$(jq -r '.other_refs' /tmp/issue.json)"
            echo "reason=$(jq -r '.reason'      /tmp/issue.json)"
            echo "matched_line=$(jq -r '.matched.line' /tmp/issue.json)"
          } >> "$GITHUB_OUTPUT"

          echo "タイトル: $(cat /tmp/title.txt)"
          echo "採用した行: L$(jq -r '.matched.line' /tmp/issue.json)（$(jq -r '.matched.section' /tmp/issue.json)）"

      # 廃止・不要化・Phase 2 移送済みのパッケージは起票させない。
      # WBS 上で取り消し線になっているものを掘り起こすのは、ほぼ確実に操作ミスのため。
      - name: 廃止済みパッケージの起票を止める
        if: steps.issue.outputs.retired == 'true'
        run: |
          echo "::error::このパッケージは廃止・不要化・Phase 2 移送済みです。起票しません"
          echo "理由: ${{ steps.issue.outputs.reason }}"
          exit 1

      # start_loop が指定されていても、3条件のうち機械が見られる2つが
      # 満たされていなければ `auto` は付けない。安全側に倒す。
      - name: auto ラベルの可否を判定
        id: gate
        run: |
          set -euo pipefail
          START='${{ inputs.start_loop }}'
          BLOCKED='${{ steps.issue.outputs.blocked }}'
          SPEC='${{ steps.issue.outputs.spec_ref }}'

          if [ "$START" != "true" ]; then
            echo "既定どおり auto を付けずに起票します（完了条件を埋めてから手で付けてください）"
            echo "apply_auto=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$BLOCKED" = "true" ]; then
            echo "::warning::WBS 上でブロック中のため auto を付けません（設計 §10.1.3 条件2）"
            echo "apply_auto=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$SPEC" ]; then
            echo "::warning::正本の節番号を抽出できなかったため auto を付けません（設計 §10.1.3 条件1）"
            echo "apply_auto=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "::warning::auto を付けて起票します。完了条件が空欄のままだと PM エージェントが自分で解釈します"
          echo "apply_auto=true" >> "$GITHUB_OUTPUT"

      - name: ラベルの存在を保証する
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          # 既にあれば失敗するので握りつぶす。--force は色を上書きしてしまうので使わない。
          gh label create "needs-spec" --repo "${{ github.repository }}" \
            --color "D4C5F9" --description "仕様が未確定。auto に流す前にオーナーの回答が要る" 2>/dev/null || true
          gh label create "auto" --repo "${{ github.repository }}" \
            --color "0E8A16" --description "自律ループの対象（3条件を満たしたものだけ）" 2>/dev/null || true
          gh label create "from-wbs" --repo "${{ github.repository }}" \
            --color "C2E0C6" --description "WBS_Phase1.md から自動生成された Issue" 2>/dev/null || true

      # ⚠️ GITHUB_TOKEN ではなく AUTOMATION_PAT を使う。
      #    GITHUB_TOKEN が作成・ラベル付けしたイベントは他のワークフローを起動しないため、
      #    `auto` を付けても auto-01-plan.yml が発火しない（GitHub の再帰実行防止の仕様）。
      - name: Issue を作成する
        id: create
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail

          LABELS="from-wbs"
          FROM_WBS="$(cat /tmp/labels.txt)"
          [ -n "$FROM_WBS" ] && LABELS="${LABELS},${FROM_WBS}"
          [ "${{ steps.gate.outputs.apply_auto }}" = "true" ] && LABELS="${LABELS},auto"

          echo "付与するラベル: ${LABELS}"

          URL="$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "$(cat /tmp/title.txt)" \
            --body-file /tmp/body.md \
            --label "$LABELS")"

          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"
          echo "作成しました: ${URL}"

      # ── 起票支援（設計 §10.1.5 導線2 ／ 2026-09-13 オーナー決定で有効化）────────
      #
      # 完了条件とスコープ外を、仕様を読んだうえで起草する。オーナーは起草を読んで
      # `auto` を付ける。**その行為が承認である。**
      #
      # ⚠️ 設計は当初これを禁じていた（「起票の場で仕様を考えることになり、ゲート1が
      #    PM の解釈とオーナーの意図の照合ではなく、PM の解釈と機械の解釈の照合になる」）。
      #    2026-09-13 のオーナー決定でその制約を解いた。代わりに次の2点で歯止めを掛ける:
      #      ① draft.json が docs/spec/ を物理的に書けなくする（仕様を作る側へ回らせない）
      #      ② 仕様から読み取れない論点は埋めさせず、選択肢3つ＋推奨を出させる（§3.2）
      #    詳細は設計 §10.1.5。
      - name: 起票支援エージェント（完了条件・スコープ外の起草）
        if: inputs.draft
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--model claude-opus-5 --effort high'
          settings: automation/settings/draft.json
          prompt: |
            automation/agents/issue-draft.md を読み、その指示に従うこと。
            対象 Issue 番号: ${{ steps.create.outputs.number }}

      - name: 実行サマリー
        run: |
          {
            echo "## WBS → Issue 生成"
            echo
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 入力 | \`${{ inputs.package }}\` |"
            echo "| 採用した作業パッケージ | \`${{ steps.issue.outputs.package }}\`（WBS L${{ steps.issue.outputs.matched_line }}） |"
            if [ "${{ steps.wbs.outputs.found }}" != "true" ]; then
              echo "| 番号の特定 | ⚠️ **エージェントが特定しました**（入力と不一致） |"
            fi
            echo "| Issue | ${{ steps.create.outputs.url }} |"
            echo "| 根拠となる仕様 | ${{ steps.issue.outputs.spec_ref }} |"
            if [ -n "${{ steps.issue.outputs.other_refs }}" ]; then
              echo "| 他ドキュメントへの参照 | ${{ steps.issue.outputs.other_refs }}（v13 の節ではありません） |"
            fi
            echo "| WBS 上のブロック | ${{ steps.issue.outputs.blocked }} |"
            echo "| auto を付与したか | ${{ steps.gate.outputs.apply_auto }} |"
            echo "| 完了条件を起草したか | ${{ inputs.draft }} |"
            echo
            if [ "${{ steps.gate.outputs.apply_auto }}" != "true" ]; then
              echo "### 次にやること"
              echo
              if [ "${{ inputs.draft }}" = "true" ]; then
                echo "1. Issue を開き、**起草された完了条件とスコープ外**を読む"
                echo "2. 起草エージェントのコメントで **根拠の節番号**を確認する"
                echo "3. \`⚠️ 要オーナー確認\` が付いていれば、選択肢を1文字でコメントする"
                echo "4. よければ \`auto\` ラベルを付ける ← **これが承認です**"
                echo
                echo "> 起草が違っていれば Issue 本文を直接編集してください。編集後に \`auto\` を付ければ反映されます。"
              else
                echo "1. Issue の **完了条件** を「〜が〜できる」の形で埋める（起草を無効にして実行しました）"
                echo "2. **スコープ外** に、今回やらないことを書く"
                echo "3. 起票前チェックの3条件を確認し、揃っていれば \`auto\` ラベルを手で付ける"
              fi
              echo
              echo "\`auto\` を付けた時点で \`auto-01-plan.yml\`（計画フェーズ）が動きます。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
