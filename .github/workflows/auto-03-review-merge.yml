# 自律ループ 03 検証・マージフェーズ
#
# トリガ : Issue が `auto:review` になった時／その PR が更新された時
# 担当   : レビュー 5a・5b・5c（並列）→ 修正 → マージ → PM（報告）
# ゲート : ゲート3（Environment `gate-merge`）。低リスクの6条件をすべて満たす場合のみ省略する
# 設計   : docs/自律開発ループ設計.md §3 #5a/#5b/#5c/#6/#7・§4.1・§4.3・§6・§6.2・§8.2・§10.9・§11.6
#
# ── 責務の分界（auto-01・auto-02 と同じ）──
#   エージェント = レビュー本文・修正・LOOP_LOG.md の記述と、末尾のマーカー出力
#   ワークフロー = マーカーを読んだ判定、ラベル遷移、ゲート制御、コミット・push・マージ
#
# ── 修正ループの回り方 ──
#   修正エージェントが push する → ci.yml が走る → pull_request(synchronize) で
#   このワークフローが再び起動する → レビューからやり直す。
#   回数は automation/state/issue-<n>.json で数える（段7 ／ 2026-09-13）。
#   種別を infra / verify / review の3つに分け、エラー指紋が2回続いたら止める。
#   旧版は Issue コメントの `<!--retry-->` を数える1種類で、基盤エラーでも
#   上限まで空回りしていた（試運転で2件踏んだ・設計 §12.1.8 #5）。

name: 自律ループ 03 検証・マージ

on:
  issues:
    types: [labeled]
  pull_request:
    types: [synchronize]

# 同一タスクの多重起動を防ぐ。Issue 経路と PR 経路で同じ文字列になるよう、
# auto-02 のブランチ命名（feature/issue-<N>）へ寄せて解決する。
# 全体を1グループにしないのは、承認待ち（最大30日・設計 §8.3）の run が
# 他タスクのレビューを堰き止めてしまうため。
# ⚠️ 2026-09-13 修正（Issue #4 の自己ロックと同型の不具合）
# `issues: types:[labeled]` はラベル名で絞れないため、ラベルが動くたびに run が作られる。
# 旧設定は空振り run も同じ concurrency グループへ入れており、
# ワークフロー自身のラベル書き込みが生成した run が、pending 中の本番 run を
# キャンセルしていた（GitHub は1グループにつき pending を1本しか保持しない）。
# 実際に仕事をする run だけを本番グループへ入れ、空振りは run_id で隔離する。
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('auto-review-{0}', github.event.pull_request.head.ref)
        || (github.event.label.name == 'auto:review'
            && format('auto-review-feature/issue-{0}', github.event.issue.number)
            || format('auto-review-noop-{0}', github.run_id)) }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  # claude-code-action は OIDC トークンでの認証を必要とする（auto-01 で欠落して失敗した）。
  id-token: write
  actions: read
  checks: read

env:
  MODEL: claude-opus-5
  OWNER: KoshiNakano1017

jobs:
  # ── 文脈の解決: Issue 番号・PR 番号・ブランチ・head SHA ────────────────
  # 2つのトリガから入ってくるため、以降のジョブが同じ形で使えるように最初に揃える。
  context:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'auto:review')
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && startsWith(github.event.pull_request.head.ref, 'feature/issue-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue: ${{ steps.resolve.outputs.issue }}
      pr: ${{ steps.resolve.outputs.pr }}
      branch: ${{ steps.resolve.outputs.branch }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Issue と PR を対応づける
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ISSUE_IN: ${{ github.event.issue.number }}
          PR_IN: ${{ github.event.pull_request.number }}
          BRANCH_IN: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "issues" ]; then
            ISSUE="$ISSUE_IN"
            BRANCH="feature/issue-${ISSUE}"
            PR="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$PR" ]; then
              echo "::error::${BRANCH} に対応する open な PR がありません（auto-02 が PR を作れていない可能性・設計 §10.7）"
              exit 1
            fi
          else
            PR="$PR_IN"
            BRANCH="$BRANCH_IN"
            ISSUE="${BRANCH#feature/issue-}"
          fi
          case "$ISSUE" in
            ''|*[!0-9]*)
              echo "::error::ブランチ名から Issue 番号を取り出せません: ${BRANCH}"
              exit 1
              ;;
          esac
          SHA="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          {
            echo "issue=${ISSUE}"
            echo "pr=${PR}"
            echo "branch=${BRANCH}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Issue #${ISSUE} / PR #${PR} / ${BRANCH} / ${SHA}"

  # ── 仕様書ガード（設計 §8.2）─────────────────────────────────────
  # ループが正本を書き換えていないことの機械的検査。
  # settings（§7.2）でのツール拒否と合わせた二重防御の、2枚目にあたる。
  spec-guard:
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.branch }}
          fetch-depth: 0

      # ── ガード① : WBS 以外の仕様書に差分があれば失敗（設計 §8.2） ──────────
      #   WBS_Phase1.md だけは導線5（設計 §10.1.5）が進捗セルを更新するため除外する。
      #   除外した分は下の「ガード②」が構造比較で受ける。**緩和ではなく差し替え。**
      - name: 仕様書が変更されていないことを確認（WBS を除く）
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only origin/main...HEAD \
            -- 'docs/spec/' ':(exclude)docs/spec/WBS_Phase1.md' || true)"
          if [ -n "$CHANGED" ]; then
            echo "::error::自律ループは docs/spec/ を変更できません（自律開発ループ設計 §0・§8.2）"
            printf '%s\n' "$CHANGED"
            exit 1
          fi
          echo "docs/spec/（WBS を除く）に差分なし"

      # ── ガード② : WBS の差分が許可セルだけかを構造比較で検証（設計 §8.2） ──
      #   許可は「Issue が指す作業パッケージ1行の、実装 / 総合 / ステータス」だけ。
      #   grep ではなく表としてパースして比べる。パース不能は失敗させる（安全側）。
      - name: WBS の変更が進捗セルだけかを確認
        env:
          ISSUE: ${{ needs.context.outputs.issue }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail

          if ! git diff --quiet origin/main...HEAD -- 'docs/spec/WBS_Phase1.md'; then
            echo "WBS に差分あり。許可範囲かを検証する"
          else
            echo "WBS に差分なし"
            exit 0
          fi

          # どの作業パッケージの進捗なのかは Issue 本文のマーカーが正（設計 §10.1.5 導線5）。
          PKG="$(gh issue view "$ISSUE" --repo "$REPO" --json body \
            --jq '.body' | grep -oE '<!--wbs:[^>]+-->' | head -1 \
            | sed -E 's/<!--wbs:(.*)-->/\1/' || true)"

          if [ -z "$PKG" ]; then
            echo "::error::Issue #${ISSUE} に <!--wbs:...--> マーカーがありません。"
            echo "::error::どの作業パッケージの進捗か特定できないため、WBS の変更を許可できません。"
            exit 1
          fi
          echo "対象の作業パッケージ: ${PKG}"

          git show origin/main:docs/spec/WBS_Phase1.md > /tmp/wbs_base.md
          PYTHONIOENCODING=utf-8 python3 automation/scripts/wbs_guard.py \
            --base /tmp/wbs_base.md \
            --head docs/spec/WBS_Phase1.md \
            --package "$PKG"

  # ── CI（ci.yml）の結果を待つ（設計 §7「CI が赤い PR をマージしない」）──
  # 自分自身のチェックを待って自己デッドロックしないよう、ci.yml の run だけを直接見る。
  ci-status:
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      green: ${{ steps.wait.outputs.green }}
    steps:
      - name: ci.yml の完了を待つ
        id: wait
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.context.outputs.sha }}
        run: |
          set -uo pipefail
          GREEN=false
          for i in $(seq 1 80); do
            RUN="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion // "-")"' 2>/dev/null || echo "")"
            if [ -z "$RUN" ] || [ "$RUN" = "null null" ]; then
              echo "(${i}/80) ${SHA} に対する ci.yml の run がまだありません"
            else
              STATUS="${RUN%% *}"
              CONCLUSION="${RUN##* }"
              echo "(${i}/80) status=${STATUS} conclusion=${CONCLUSION}"
              if [ "$STATUS" = "completed" ]; then
                [ "$CONCLUSION" = "success" ] && GREEN=true
                break
              fi
            fi
            sleep 30
          done
          if [ "$GREEN" != "true" ]; then
            # ここでジョブを落とさない。CI が赤いときは修正エージェントの担当だから（設計 §3 #6）。
            echo "::warning::ci.yml が緑ではありません。マージへは進みません"
          fi
          echo "green=${GREEN}" >> "$GITHUB_OUTPUT"

  # ── レビュー・修正オーケストレータ（段7 ／ 2026-09-13）──────────────
  #
  # 5a・5b・5c は引き続き並列。観点を混ぜた1体より、観点を絞った3体のほうが
  # 見落としが減る（設計 §3.0）。並列化はジョブではなくプロセス内で行う。
  #
  # 旧版はここに6ジョブ（review-quality / review-spec / review-privacy /
  # verdict / blocked-privacy / fix）が並び、各ジョブが claude-code-action を呼んで
  # 出力を PR コメントへ転記し、`<!--review kind=... result=...-->` を grep していた。
  # 修正1回ごとにワークフローを一周していたため、型エラー1つ直すのに
  # 再 checkout と文脈の読み直しが発生していた（設計 §12.1.8 #2）。
  #
  # 本版は automation/orchestrator/review.mjs が
  #   5a/5b/5c 並列 → 修正 → verify.sh → テスト sha256 照合 → spec_ref の sha 再検証
  # を1プロセスで回す。**ジョブ ID は verdict のまま**にしてある。
  # 後続の risk / merge / report が `needs.verdict.outputs.findings` と
  # `privacy_reject` を読んでおり、そこを変えずに中身だけ差し替えるため。
  verdict:
    needs: [context, spec-guard, ci-status]
    if: >-
      always()
      && needs.context.result == 'success'
      && needs.spec-guard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      findings: ${{ steps.orc.outputs.findings }}
      privacy_reject: ${{ steps.orc.outputs.privacy_reject }}
      blocked: ${{ steps.orc.outputs.blocked }}
      reason: ${{ steps.orc.outputs.reason }}
      blocked_kind: ${{ steps.orc.outputs.blocked_kind }}
    steps:
      # PAT で checkout する。修正コミットの push が ci.yml を起動する必要があるため（設計 §8.1）。
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存をインストール
        run: npm ci --no-audit --no-fund

      - name: エージェント定義と段取りの検査
        run: |
          python3 automation/scripts/check_agents.py
          python3 automation/scripts/check_stages.py

      - name: レビュー・修正オーケストレータ
        id: orc
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORC_MAX_TURNS: '60'
        run: |
          node automation/orchestrator/review.mjs             --issue "${{ needs.context.outputs.issue }}"             --pr "${{ needs.context.outputs.pr }}"             --base origin/main

      # 修正が入った場合のみ push する。push が ci.yml を起こし、
      # pull_request(synchronize) でこのワークフローが再び回る（設計 §6.2 の修正ループ）。
      - name: 修正を push する
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 受入テストと docs/spec/ は触らせない。orchestrator 内でも見ているが、
          # push の直前にもう一度見る（設計 §7.2 の二重化）。
          for guarded in docs/spec tests; do
            DIRTY="$(git status --porcelain -- "$guarded" | sed 's/^...//' || true)"
            if [ -n "$DIRTY" ]; then
              echo "::error::${guarded} が変更されています（設計 §0・§11.6）"
              printf '%s\n' "$DIRTY"
              exit 1
            fi
          done
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "修正なし。push しません"
            exit 0
          fi
          git add -A
          git commit -F - <<'COMMIT_MSG'
          fix: レビュー指摘への対応

          レビュー 5a/5b/5c の [必須] 指摘を修正し、verify.sh（型・lint・単体）を通した。
          根拠: docs/自律開発ループ設計.md §3 #6・§12.1.2 ORC3
          COMMIT_MSG
          git push origin HEAD:"${{ needs.context.outputs.branch }}"

  # ── 停止: 個人情報の検出・修正の非収束・テスト改変など ────────────
  blocked-review:
    needs: [context, verdict]
    if: always() && needs.verdict.outputs.blocked == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 停止事由に応じてラベルを付け替え、通知する
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ needs.context.outputs.issue }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ needs.verdict.outputs.reason }}
          KIND: ${{ needs.verdict.outputs.blocked_kind }}
        run: |
          set -euo pipefail
          # 2026-09-16: spec → auto:blocked（オーナー判断）／ infra・credit → auto:retry（自動再開）
          # 個人情報の検出（review-privacy）は必ず spec 側に落ちるため、人間の目を通る。
          KIND="${KIND:-spec}"
          if [ "$KIND" = "spec" ]; then
            NEW_LABEL="auto:blocked"
          else
            NEW_LABEL="auto:retry"
          fi
          gh issue edit "$ISSUE" --repo "$REPO" \
            --remove-label "auto:review" --add-label "$NEW_LABEL" || true

          if [ "$NEW_LABEL" = "auto:retry" ]; then
            cat > notice.md <<'EOF'
          ## ⏳ 検証フェーズが一時的な事由で停止しました

          仕様の問題ではありません。**オーナーの操作は不要です。**
          スイーパー（`auto-05-sweep.yml`）が時間をおいて自動で再開します。

          <!--retry:from=auto:review-->
          EOF
            printf '\n事由: `%s`\n理由: %s\n実行: %s\n' \
              "$KIND" "${REASON:-（理由の記録がありません）}" "$RUN_URL" >> notice.md
          else
            {
              echo "@${OWNER} 検証フェーズが停止しました。**オーナーの判断が要ります。**"
              echo
              echo "${REASON:-理由は PR / Issue のコメントを参照してください。}"
              echo
              echo '再開は `auto:blocked` を外し、`auto:review` を付け直してください。'
              echo
              echo "> この項目は、着手可能な仕事が尽きた時点で**枯渇レポート**にまとめて報告されます。"
              echo
              echo "実行: ${RUN_URL}"
            } > notice.md
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body-file notice.md
  risk:
    needs: [context, verdict, ci-status, spec-guard]
    if: >-
      always()
      && needs.context.result == 'success'
      && needs.spec-guard.result == 'success'
      && needs.verdict.outputs.findings == 'false'
      && needs.verdict.outputs.privacy_reject != 'true'
      && needs.ci-status.outputs.green == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      risk: ${{ steps.judge.outputs.risk }}
      auto_pass: ${{ steps.judge.outputs.auto_pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.branch }}
          fetch-depth: 0

      - name: リスク区分と自動通過条件を判定する
        id: judge
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ needs.context.outputs.issue }}
          REPO: ${{ github.repository }}
          CI_GREEN: ${{ needs.ci-status.outputs.green }}
        run: |
          set -euo pipefail

          BODIES="$(gh issue view "$ISSUE" --repo "$REPO" --json body,comments \
            --jq '.body, (.comments[].body)')"

          # ── 計画フェーズの判定を引き継ぐ（auto-01 と同じマーカー）──
          RISK_BEFORE="$(printf '%s' "$BODIES" \
            | grep -oE '<!--risk:(high|mid|low)-->' \
            | tail -1 | sed -E 's/.*risk:(.*)-->/\1/' || true)"
          if [ -z "$RISK_BEFORE" ]; then
            echo "::warning::リスクマーカーが見つかりません。high として扱います"
            RISK_BEFORE=high
          fi
          echo "計画フェーズのリスク区分: ${RISK_BEFORE}"

          CHANGED="$(git diff --name-only origin/main...HEAD || true)"
          echo "変更ファイル:"
          printf '%s\n' "$CHANGED"

          # ── 個人情報タッチ時の強制繰り上げ（2026-09-05 オーナー決定）──
          # 判定は保守的に。迷ったら high。
          RISK_AFTER="$RISK_BEFORE"
          PII=false
          PII_REASON=""
          if printf '%s\n' "$CHANGED" | grep -qE '(members|member_identifiers|member_pii)'; then
            PII=true
            PII_REASON="${PII_REASON}変更ファイルのパスに会員テーブル系の名前が含まれる。"
          fi
          if git diff origin/main...HEAD \
             | grep -qE '\b(full_name|address|contact_info|member_notes|phone_number|postal_code|kana)\b|前泊地'; then
            PII=true
            PII_REASON="${PII_REASON}差分に個人情報の識別子が含まれる。"
          fi
          # Issue が引用する仕様節（v13 §5.2・§5.8・§5.9・§5.10・§6）は個人情報に関わる。
          if printf '%s' "$BODIES" | grep -qE '§ ?5\.(2|8|9|10)([^0-9]|$)|§ ?6($|[^0-9])'; then
            PII=true
            PII_REASON="${PII_REASON}Issue が個人情報に関わる仕様節（§5.2/§5.8/§5.9/§5.10/§6）を引用している。"
          fi
          if [ "$PII" = "true" ]; then
            RISK_AFTER=high
            echo "::notice::個人情報に関わるため high へ繰り上げます: ${PII_REASON}"
          fi

          # 繰り上げ専用。引き下げは無視する（auto-01 の rank() と同じ規律・設計 §3.2.1）。
          rank() { case "$1" in low) echo 0 ;; mid) echo 1 ;; *) echo 2 ;; esac; }
          if [ "$(rank "$RISK_AFTER")" -gt "$(rank "$RISK_BEFORE")" ]; then
            RISK="$RISK_AFTER"
            echo "::notice::リスク区分を ${RISK_BEFORE} → ${RISK} へ繰り上げました"
          else
            RISK="$RISK_BEFORE"
          fi
          echo "risk=${RISK}" >> "$GITHUB_OUTPUT"

          # ── 自動通過の条件（設計 §4.1 改訂 2026-09-16）──
          # 旧版は「低リスクのみ・6条件すべて」だった。承認をマージ前1回へ集約した
          # 改訂により、自動通過の対象を **高リスク以外** へ広げる。
          #
          # 条件③（段取りの宣言範囲内）は FAILED から WARNED へ移した。
          # 理由: ゲート1・2を撤去したため、段取りは**誰の承認も経ていない**。
          # つまり③はもはや「オーナーが承認した範囲を逸脱したか」ではなく
          # 「エージェントの自己申告と実際が一致するか」という自己整合性検査であり、
          # 逸脱の実害はレビュー3種と CI が捕える。しかも判定は段取りコメントの
          # backtick を grep する脆い実装で、書式が揺れると読み取れず（③の失敗）
          # 無関係なタスクが承認待ちで滞留する。警告として残し、停止事由から外す。
          FAILED=""
          WARNED=""

          # ① CI が全ジョブ緑
          if [ "$CI_GREEN" != "true" ]; then FAILED="${FAILED}①CIが緑でない / "; fi

          # ② レビュー3種の [必須] 指摘がゼロ（このジョブは findings==false のときだけ動く）

          # ③ 変更ファイルが段取りで宣言した範囲内
          PLAN="$(gh issue view "$ISSUE" --repo "$REPO" --json comments             --jq '[.comments[].body | select(test("^## 段取り"; "m"))] | last // ""' || true)"
          DECLARED="$(printf '%s' "$PLAN" | grep -oE '`[^`]+`' | tr -d '`' \
            | grep -E '^[A-Za-z0-9_./@-]+$' | grep -E '/|\.[A-Za-z0-9]+$'             | sed 's:/*$::' | sort -u || true)"
          if [ -z "$DECLARED" ]; then
            WARNED="${WARNED}③段取りから変更ファイルの宣言を読み取れない / "
          else
            OUT=""
            while IFS= read -r f; do
              if [ -z "$f" ]; then continue; fi
              ok=0
              while IFS= read -r d; do
                if [ -z "$d" ]; then continue; fi
                case "$f" in "$d"|"$d"/*) ok=1; break ;; esac
              done <<EOF
          $DECLARED
          EOF
              if [ "$ok" -eq 0 ]; then OUT="${OUT}${f} "; fi
            done <<EOF
          $CHANGED
          EOF
            if [ -n "$OUT" ]; then
              WARNED="${WARNED}③宣言外のファイルを変更している（${OUT}） / "
            fi
          fi

          # ④ 新規依存パッケージの追加なし
          if printf '%s\n' "$CHANGED" | grep -qE '^(package\.json|package-lock\.json|requirements\.txt|pyproject\.toml)$'; then
            FAILED="${FAILED}④依存定義ファイルに差分がある / "
          fi

          # ⑤ docs/spec/ に差分なし（spec-guard が通っている時点で保証されるが、明示的に確認する）
          printf '%s\n' "$CHANGED" | grep -q '^docs/spec/' && FAILED="${FAILED}⑤docs/spec/に差分がある / "

          # ⑥ supabase/migrations/ に差分なし
          printf '%s\n' "$CHANGED" | grep -q '^supabase/migrations/' && FAILED="${FAILED}⑥supabase/migrations/に差分がある / "

          # オーナーが計画フェーズの通知を見て異議を出した場合、区分によらずゲート3へ送る
          # （設計 §4.1「異議申立ての窓を持たない自動通過は認めない」を、時間待ちではなく
          #   ラベルで実現したもの。auto-01 の notify-classification が案内している）。
          NEEDS_REVIEW=false
          if gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '.labels[].name'              | grep -qx 'auto:needs-review'; then
            NEEDS_REVIEW=true
          fi

          AUTO_PASS=false
          if [ "$RISK" != "high" ] && [ "$PII" != "true" ] && [ "$NEEDS_REVIEW" != "true" ] && [ -z "$FAILED" ]; then
            AUTO_PASS=true
          fi
          echo "auto_pass=${AUTO_PASS}" >> "$GITHUB_OUTPUT"
          echo "リスク区分: ${RISK} / 自動通過: ${AUTO_PASS} / 欠けた条件: ${FAILED:-なし} / 警告: ${WARNED:-なし}"

          # 判定はオーナーが見えるところに残す。異議の材料になるため（設計 §4.1）。
          {
            echo "## ゲート3の判定"
            echo
            echo "- リスク区分: **${RISK}**（計画フェーズ: ${RISK_BEFORE}）"
            if [ "$PII" = "true" ]; then
              echo "- **個人情報に関わるため high へ繰り上げました**（2026-09-05 オーナー決定）: ${PII_REASON}"
              echo "  - 低リスク自動通過の対象から除外し、ゲート3を必ず経由します"
            fi
            echo "- 自動通過（設計 §4.1 改訂: 高リスク以外＋①④⑤⑥）: ${AUTO_PASS}"
            echo "- 欠けた条件: ${FAILED:-なし}"
            echo "- 警告（停止事由ではない）: ${WARNED:-なし}"
            if [ "$NEEDS_REVIEW" = "true" ]; then
              echo "- **\`auto:needs-review\` が付いているため、区分によらずゲート3を経由します**"
            fi
            echo
            if [ "$AUTO_PASS" = "true" ]; then
              echo "条件を満たしたため、ゲート3を省略してマージへ進みます。"
              echo
              echo "> 覆したい場合は PR を close するか、Issue に \`auto:needs-review\` を付けてください。"
            else
              echo "@${OWNER} ゲート3（Environment \`gate-merge\`）で承認をお願いします。"
            fi
          } > verdict.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file verdict.md

  # ── ゲート3: マージ前の承認（設計 §4.2）─────────────────────────
  # 低リスクの6条件をすべて満たした場合だけ省略できる。
  approve-merge:
    needs: risk
    if: needs.risk.outputs.auto_pass != 'true'
    runs-on: ubuntu-latest
    environment: gate-merge
    steps:
      - run: echo "マージが承認されました（リスク区分 ${{ needs.risk.outputs.risk }}）"

  # ── 却下: ゲート3で Reject された ──────────────────────────────
  rejected:
    needs: [context, approve-merge]
    if: always() && contains(fromJSON('["failure","cancelled"]'), needs.approve-merge.result)
    runs-on: ubuntu-latest
    steps:
      - name: auto:rejected へ付け替え
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ needs.context.outputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$REPO" \
            --remove-label "auto:review" --add-label "auto:rejected" || true
          # 却下理由は Environment のコメントに書かれても Issue には流れない（設計 §10.10.1）。
          printf '%s\n' \
            'ゲート3で却下されました。**却下理由を Issue にコメントしてください**（Environment のコメントはエージェントから読めません・設計 §10.10.1）。§10.4 のマーカー `<!--reject phase=gate3 kind=scope|spec|how|question-->` を先頭に置くと、週次の集計に入ります。' > notice.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file notice.md

  # ── マージ ────────────────────────────────────────────────────
  merge:
    needs: [context, risk, approve-merge]
    if: >-
      always()
      && needs.risk.result == 'success'
      && !contains(fromJSON('["failure","cancelled"]'), needs.approve-merge.result)
      && (needs.approve-merge.result == 'success' || needs.risk.outputs.auto_pass == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.do.outputs.sha }}
    steps:
      - name: PR を main へマージする
        id: do
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.context.outputs.pr }}
        run: |
          set -euo pipefail
          # squash でマージする。PR タイトルがそのまま main のコミット件名になり、
          # 「1コミット1論点」（CLAUDE.md §5.2）が main の履歴で成立する。
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          SHA="$(gh pr view "$PR" --repo "$REPO" --json mergeCommit --jq '.mergeCommit.oid // ""')"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "マージコミット: ${SHA}"

  # ── PM（報告）: LOOP_LOG.md への記録（設計 §3 #7・§10.9）──────────
  report:
    needs: [context, risk, merge]
    if: always() && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT }}

      - name: PMエージェント（報告）
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model ${{ env.MODEL }} --effort medium'
          settings: automation/settings/pm.json
          prompt: |
            automation/agents/pm-report.md を読み、その指示に従うこと。
            対象 Issue 番号: ${{ needs.context.outputs.issue }}
            対象 PR 番号: ${{ needs.context.outputs.pr }}
            マージコミット: ${{ needs.merge.outputs.sha }}

      # PM の編集はランナー内に留まる（pm.json に git が無い）。
      # auto-01 と同じく、ワークフローが決定的にコミット・push する。
      - name: PMの編集をコミット・push（LOOP_LOG.md／TASKS.md）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- LOOP_LOG.md TASKS.md QUESTIONS.md; then
            echo "::warning::PM（報告）が LOOP_LOG.md を更新していません（設計 §10.9 の指標の素材が残りません）"
            exit 0
          fi
          git add LOOP_LOG.md TASKS.md QUESTIONS.md
          git commit -m "docs: PM(報告)によるLOOP_LOG.md更新 (Issue #${{ needs.context.outputs.issue }})"
          PUSHED=false
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then PUSHED=true; break; fi
            echo "push失敗。origin/main を取り込んで再試行 (${i}/5)"
            git fetch origin main
            # 競合したら中断する。中断しないと .git/rebase-merge が残り、
            # 以後の git 操作が全部失敗する（2026-09-15 に auto-01 で発生）。
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::warning::rebase が競合したため中断した（試行 ${i}）"
            fi
            sleep $((i * 3))
          done
          if [ "$PUSHED" != "true" ]; then
            # マージは済んでいるのでループ全体は失敗させない。ただし黙って落とさない。
            echo "::warning::LOOP_LOG.md の push に5回失敗しました。ブランチ保護の設定を確認してください"
          fi

      - name: 報告を転記する
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          bash automation/scripts/post_agent_output.sh \
            "${{ steps.agent.outputs.execution_file }}" \
            issue "${{ needs.context.outputs.issue }}" \
            "auto-03 / PM 報告" /tmp/report-output.md

      - name: auto:done に付け替えて Issue を閉じる
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ needs.context.outputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$REPO" \
            --remove-label "auto:review" --add-label "auto:done" || true
          gh issue close "$ISSUE" --repo "$REPO" --reason completed || true
