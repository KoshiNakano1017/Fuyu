# 自律ループ 01 計画フェーズ
#
# トリガ : Issue に `auto` ラベルが付いた時
# 担当   : automation/orchestrator/plan.mjs
#          （PM定義 → リスク判定 → 調査 → PM段取り を1プロセスで回す）
# ゲート : リスク区分により 0〜2 回停止する（設計 §4.1）
# 設計   : docs/自律開発ループ設計.md §12.1.2 ORC1 ／ §12.1.6 段4
#
# ── 2026-09-13 改訂（段4）─────────────────────────────────────
# 旧版は 416 行あり、`define` と `plan` の2ジョブに分かれ、各ジョブが
# Issue コメントを grep してリスク区分を読み取っていた（`classify`/`reclassify`）。
# マーカーが空振りすると判定を読めず高リスクへ縮退する失敗モードがあり、
# 調査の発見を段取りが文章から復元する無駄もあった。
#
# 本版は判定をオーケストレータの構造化出力へ移し、YAML には
# **ゲートとラベル遷移だけ**を残す（設計 §12.1.8 #1）。
#
# ── 責務の分界 ──────────────────────────────────────────────
#   オーケストレータ = エージェントの実行順序・判定・Issue コメント・state 更新
#   ワークフロー     = ラベル遷移、ゲート制御、コミット・push
#   機械的に決まるものは機械が持つ。ゲートは if 文であるべきで、
#   エージェントに制御フローを渡すと「説得できる門番」ができる（設計 §12.1.3）。

name: 自律ループ 01 計画

on:
  issues:
    types: [labeled]

# ⚠️ 2026-09-13 修正（Issue #4 の自己ロック）
#
# `on: issues: types: [labeled]` にラベル名のフィルタは書けないため、
# **ラベルが動くたびに run が生成される**（`if:` は job 側なので run 自体は作られる）。
# 旧版は全ての run を同じ concurrency グループへ入れていたため、
# 「このワークフロー自身が `auto:planning` / `auto:blocked` を付ける」ことで
# 生成された空振り run が、**pending 中だったオーナーの再開 run をキャンセル**していた。
# （GitHub は1グループにつき pending を1本しか保持せず、新しい run が
#   先に pending だった run を追い出す仕様のため）
#
# 対策: 実際に仕事をする run（label == 'auto'）だけを本番グループへ入れ、
# 空振り run には run_id で一意なグループを与えて隔離する。
concurrency:
  group: >-
    ${{ github.event.label.name == 'auto'
        && format('auto-plan-{0}', github.event.issue.number)
        || format('auto-plan-noop-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write

env:
  OWNER: KoshiNakano1017

jobs:
  # ── 計画オーケストレータ ────────────────────────────────────
  plan:
    if: github.event.label.name == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      risk: ${{ steps.orc.outputs.risk }}
      blocked: ${{ steps.orc.outputs.blocked }}
      blocked_reason: ${{ steps.orc.outputs.blocked_reason }}
    steps:
      - uses: actions/checkout@v4

      - name: ラベルを auto:planning に付け替え
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "auto" --add-label "auto:planning"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --omit=optional を付けてはならない。Agent SDK は実行バイナリを
      # optionalDependencies で配るため、省くと起動時に見つからず落ちる。
      - name: 依存をインストール
        run: npm ci --no-audit --no-fund

      - name: エージェント定義の検査（段2）
        run: python3 automation/scripts/check_agents.py

      # 段取り表の宣言と実態が一致しているかを機械的に見る。
      # 「完了扱いの未着手」を二度と作らないための検査（2026-09-13 追加）。
      - name: 段取りの宣言と実態の一致を検査
        run: python3 automation/scripts/check_stages.py

      - name: 計画オーケストレータ
        id: orc
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORC_MAX_TURNS: '40'
        run: node automation/orchestrator/plan.mjs --issue "${{ github.event.issue.number }}"

      # エージェントは git を持たない（settings の Bash 許可リストに無い）。
      # 永続化は例外なく機械側に寄せる。
      - name: PM の編集と state をコミット・push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PATHS="TASKS.md QUESTIONS.md LOOP_LOG.md automation/state"
          if git diff --quiet -- $PATHS && [ -z "$(git ls-files --others --exclude-standard -- $PATHS)" ]; then
            echo "変更なし"
            exit 0
          fi
          git add $PATHS
          git commit -m "docs: 計画フェーズによる TASKS.md／QUESTIONS.md／state の更新 (Issue #${{ github.event.issue.number }})"
          # エージェントのステップを経由すると checkout の認証情報が失われるため張り直す。
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git fetch origin main && git rebase origin/main
            sleep $((i * 3))
          done

  # ── 停止: 仕様が未確定 ────────────────────────────────────
  blocked:
    needs: plan
    if: always() && needs.plan.outputs.blocked == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: auto:blocked へ付け替えて通知
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$REPO" \
            --remove-label "auto:planning" --add-label "auto:blocked"
          # ⚠️ 2026-09-13 修正。旧版は「選択肢から1つ返信してください」とだけ書いていたが、
          # **Issue コメントはどのワークフローもトリガしない**（issue_comment を拾うのは
          # claude-review.yml だけで、その条件は PR 限定）。指示どおり操作しても動かない。
          # 再開に必要な操作を明記する（設計 §10.5）。
          cat > notice.md <<'EOF'
          @OWNER_PLACEHOLDER 仕様が未確定のため計画フェーズを停止しました。

          **再開の手順（この2つを両方行ってください）**

          1. 上のコメントの選択肢への回答を、この Issue にコメントする
          2. そのうえで **`auto:blocked` を外し、`auto` ラベルを付け直す**

          > ⚠️ **コメントだけでは再開しません。** Issue へのコメントはワークフローを起動しません。
          > 再開の引き金は `auto` ラベルが「付いた」ことだけです。
          > `auto` が既に付いている場合は、一度外してから付け直してください
          > （同じラベルを付け直してもイベントは発生しません）。

          実行: RUN_URL_PLACEHOLDER
          EOF
          sed -i "s|@OWNER_PLACEHOLDER|@${OWNER}|; s|RUN_URL_PLACEHOLDER|${RUN_URL}|" notice.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file notice.md

  # ── ゲート1: タスク定義の承認（高リスクのみ・設計 §4.1）────────
  approve-definition:
    needs: plan
    if: needs.plan.outputs.blocked == 'false' && needs.plan.outputs.risk == 'high'
    runs-on: ubuntu-latest
    environment: gate-task-definition
    steps:
      - run: echo "タスク定義が承認されました（高リスク）"

  # ── ゲート2: 段取りの承認（高・中）──────────────────────────
  approve-plan:
    needs: [plan, approve-definition]
    if: >-
      always()
      && needs.plan.outputs.blocked == 'false'
      && needs.plan.outputs.risk != 'low'
      && !contains(fromJSON('["failure","cancelled"]'), needs.approve-definition.result)
    runs-on: ubuntu-latest
    environment: gate-task-plan
    steps:
      - run: echo "段取りが承認されました（リスク区分 ${{ needs.plan.outputs.risk }}）"

  # ── 低リスク: 異議申立ての通知（設計 §4.1）───────────────────
  # 「異議申立ての窓を持たない自動通過は認めない」
  low-risk-notice:
    needs: plan
    if: needs.plan.outputs.blocked == 'false' && needs.plan.outputs.risk == 'low'
    runs-on: ubuntu-latest
    steps:
      - name: auto:low-risk を付けて判定理由つきで通知
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "auto:low-risk"
          printf '%s\n\n%s\n\n%s\n' \
            "@${OWNER} **低リスクと判定したため、承認なしで実装へ進みます。** 判定理由は上のタスク定義コメントを参照してください。" \
            '異議がある場合は **30分以内に `auto:low-risk` ラベルを外してください。** 外すと中リスクへ降格し、段取りの承認（ゲート2）が必要になります。' \
            "実行: ${RUN_URL}" > notice.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file notice.md

  # ── 低リスク: 30分の異議申立て窓 ─────────────────────────────
  # Environment `gate-low-risk-objection` に Wait timer 30分・レビュアーなしを設定する。
  # sleep で待たないのは、待機中に実行時間を消費しないため。
  low-risk-window:
    needs: low-risk-notice
    runs-on: ubuntu-latest
    environment: gate-low-risk-objection
    steps:
      - run: echo "異議申立ての窓が閉じました"

  low-risk-verdict:
    needs: low-risk-window
    if: always() && needs.low-risk-window.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      demoted: ${{ steps.check.outputs.demoted }}
    steps:
      - name: auto:low-risk が残っているか確認
        id: check
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LABELS="$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '.labels[].name')"
          if printf '%s' "$LABELS" | grep -qx 'auto:low-risk'; then
            echo "demoted=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::auto:low-risk が外されました。中リスクへ降格しゲート2へ進みます"
            echo "demoted=true" >> "$GITHUB_OUTPUT"
          fi

  approve-plan-after-objection:
    needs: low-risk-verdict
    if: always() && needs.low-risk-verdict.outputs.demoted == 'true'
    runs-on: ubuntu-latest
    environment: gate-task-plan
    steps:
      - run: echo "段取りが承認されました（異議申立てにより中リスクへ降格）"

  # ── 却下 ────────────────────────────────────────────────────
  rejected:
    needs: [approve-definition, approve-plan, approve-plan-after-objection]
    if: >-
      always()
      && (contains(fromJSON('["failure","cancelled"]'), needs.approve-definition.result)
       || contains(fromJSON('["failure","cancelled"]'), needs.approve-plan.result)
       || contains(fromJSON('["failure","cancelled"]'), needs.approve-plan-after-objection.result))
    runs-on: ubuntu-latest
    steps:
      - name: auto:rejected へ付け替え
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$REPO" \
            --remove-label "auto:planning" --add-label "auto:rejected" || true
          printf '%s\n' \
            'ゲートで却下されました。**却下理由を Issue にコメントしてください**（Environment のコメントはエージェントから読めません）。再開は `auto:rejected` を外し `auto` ラベルを付け直してください。' > notice.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file notice.md

  # ── 次フェーズへ引き渡し ────────────────────────────────────
  handoff:
    needs: [plan, approve-plan, low-risk-verdict, approve-plan-after-objection]
    if: >-
      always()
      && needs.plan.result == 'success'
      && needs.plan.outputs.blocked == 'false'
      && !contains(fromJSON('["failure","cancelled"]'), needs.approve-plan.result)
      && !contains(fromJSON('["failure","cancelled"]'), needs.low-risk-verdict.result)
      && !contains(fromJSON('["failure","cancelled"]'), needs.approve-plan-after-objection.result)
      && (needs.approve-plan.result == 'success'
       || needs.low-risk-verdict.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: ラベルを auto:approved に付け替え
        env:
          # PAT でないと次のワークフローが起動しない（設計 §8.1）。
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$REPO" \
            --remove-label "auto:planning" --add-label "auto:approved"
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "auto:low-risk" || true
