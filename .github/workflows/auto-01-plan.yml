# 自律ループ 01 計画フェーズ
#
# トリガ : Issue に `auto` ラベルが付いた時
# 担当   : PM(定義) → 調査 → PM(段取り)
# ゲート : 1(タスク定義) と 2(段取り) の2つで停止する
# 設計   : docs/自律開発ループ設計.md §6.1
#
# このワークフローは **アプリのコードが1行も無い状態でも動く**。
# 計画フェーズのエージェントは Issue にコメントするだけで、コードに触らないため。

name: 自律ループ 01 計画

on:
  issues:
    types: [labeled]

# 同一 Issue の多重起動を防ぐ。
# cancel-in-progress: false にするのは、承認待ちの run を後続がキャンセルしないため。
concurrency:
  group: auto-plan-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  # モデルと effort は claude_args で Claude CLI へ直接渡す(設計 §3)。
  # effort: low | medium | high | xhigh | max
  MODEL: claude-opus-5

jobs:
  # ── PM: Issue をタスク定義に落とす ───────────────────────
  define:
    if: github.event.label.name == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: ラベルを auto:planning に付け替え
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "auto" --add-label "auto:planning"

      - name: PMエージェント（タスク定義・リスク区分の判定）
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--model ${{ env.MODEL }} --effort medium'
          settings: automation/settings/pm.json
          prompt: |
            automation/prompts/pm-define.md を読み、その指示に従うこと。
            対象 Issue 番号: ${{ github.event.issue.number }}

  # ── ゲート1: タスク定義の承認（ここで停止する）────────────
  approve-definition:
    needs: define
    runs-on: ubuntu-latest
    environment: gate-task-definition
    steps:
      - run: echo "タスク定義が承認されました"

  # ── 調査 → PM: 段取り ────────────────────────────────────
  plan:
    needs: approve-definition
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 読み取り専用。書き込み権限は settings で機械的に落とす(設計 §7.2)。
      # プロンプトに「読み取り専用です」と書くだけでは守られない。
      - name: 調査エージェント（一次情報の取得）
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--model ${{ env.MODEL }} --effort high'
          settings: automation/settings/readonly.json
          prompt: |
            automation/prompts/research.md を読み、その指示に従うこと。
            対象 Issue 番号: ${{ github.event.issue.number }}

      - name: PMエージェント（段取り）
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--model ${{ env.MODEL }} --effort medium'
          settings: automation/settings/pm.json
          prompt: |
            automation/prompts/pm-plan.md を読み、その指示に従うこと。
            対象 Issue 番号: ${{ github.event.issue.number }}

  # ── ゲート2: 段取りの承認（ここで停止する）────────────────
  approve-plan:
    needs: plan
    runs-on: ubuntu-latest
    environment: gate-task-plan
    steps:
      - run: echo "段取りが承認されました"

  # ── 次フェーズへ引き渡し ──────────────────────────────────
  handoff:
    needs: approve-plan
    runs-on: ubuntu-latest
    steps:
      - name: ラベルを auto:approved に付け替え
        env:
          # PAT でないと次のワークフローが起動しない(設計 §8.1)。
          # GITHUB_TOKEN によるラベル変更は他のワークフローをトリガしない仕様のため。
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "auto:planning" --add-label "auto:approved"
