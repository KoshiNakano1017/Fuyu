# 自律ループ 01 計画フェーズ
#
# トリガ : Issue に `auto` ラベルが付いた時
# 担当   : automation/orchestrator/plan.mjs
#          （PM定義 → リスク判定 → 調査 → PM段取り を1プロセスで回す）
# ゲート : 計画フェーズでは停止しない（2026-09-16 改訂）。承認はマージ前の1回のみ
# 設計   : docs/自律開発ループ設計.md §12.1.2 ORC1 ／ §12.1.6 段4
#
# ── 2026-09-13 改訂（段4）─────────────────────────────────────
# 旧版は 416 行あり、`define` と `plan` の2ジョブに分かれ、各ジョブが
# Issue コメントを grep してリスク区分を読み取っていた（`classify`/`reclassify`）。
# マーカーが空振りすると判定を読めず高リスクへ縮退する失敗モードがあり、
# 調査の発見を段取りが文章から復元する無駄もあった。
#
# 本版は判定をオーケストレータの構造化出力へ移し、YAML には
# **ゲートとラベル遷移だけ**を残す（設計 §12.1.8 #1）。
#
# ── 責務の分界 ──────────────────────────────────────────────
#   オーケストレータ = エージェントの実行順序・判定・Issue コメント・state 更新
#   ワークフロー     = ラベル遷移、ゲート制御、コミット・push
#   機械的に決まるものは機械が持つ。ゲートは if 文であるべきで、
#   エージェントに制御フローを渡すと「説得できる門番」ができる（設計 §12.1.3）。

name: 自律ループ 01 計画

on:
  issues:
    types: [labeled]

# ⚠️ 2026-09-13 修正（Issue #4 の自己ロック）
#
# `on: issues: types: [labeled]` にラベル名のフィルタは書けないため、
# **ラベルが動くたびに run が生成される**（`if:` は job 側なので run 自体は作られる）。
# 旧版は全ての run を同じ concurrency グループへ入れていたため、
# 「このワークフロー自身が `auto:planning` / `auto:blocked` を付ける」ことで
# 生成された空振り run が、**pending 中だったオーナーの再開 run をキャンセル**していた。
# （GitHub は1グループにつき pending を1本しか保持せず、新しい run が
#   先に pending だった run を追い出す仕様のため）
#
# 対策: 実際に仕事をする run（label == 'auto'）だけを本番グループへ入れ、
# 空振り run には run_id で一意なグループを与えて隔離する。
concurrency:
  group: >-
    ${{ github.event.label.name == 'auto'
        && format('auto-plan-{0}', github.event.issue.number)
        || format('auto-plan-noop-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write

env:
  OWNER: KoshiNakano1017

jobs:
  # ── 計画オーケストレータ ────────────────────────────────────
  plan:
    if: github.event.label.name == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      risk: ${{ steps.orc.outputs.risk }}
      blocked: ${{ steps.orc.outputs.blocked }}
      blocked_reason: ${{ steps.orc.outputs.blocked_reason }}
      blocked_kind: ${{ steps.orc.outputs.blocked_kind }}
    steps:
      - uses: actions/checkout@v4

      - name: 件名の🔴プレフィックスを外す（再開時の後始末・冪等）
        # 2026-09-25 新設: auto:blocked → auto の再付与（オーナーの再開操作）で
        # このジョブが再度走るため、ここで剥がしておけば「止まっていたが再開した」
        # 状態が件名に残らない。プレフィックスが無ければ何もしない。
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="$(gh issue view "$ISSUE" --repo "$REPO" --json title --jq .title)"
          STRIPPED="${TITLE#"🔴[要判断] "}"
          if [ "$STRIPPED" != "$TITLE" ]; then
            gh issue edit "$ISSUE" --repo "$REPO" --title "$STRIPPED"
          fi

      - name: ラベルを auto:planning に付け替え
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "auto" --add-label "auto:planning"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --omit=optional を付けてはならない。Agent SDK は実行バイナリを
      # optionalDependencies で配るため、省くと起動時に見つからず落ちる。
      - name: 依存をインストール
        run: npm ci --no-audit --no-fund

      - name: エージェント定義の検査（段2）
        run: python3 automation/scripts/check_agents.py

      # 段取り表の宣言と実態が一致しているかを機械的に見る。
      # 「完了扱いの未着手」を二度と作らないための検査（2026-09-13 追加）。
      - name: 段取りの宣言と実態の一致を検査
        run: python3 automation/scripts/check_stages.py

      - name: 計画オーケストレータ
        id: orc
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORC_MAX_TURNS: '40'
        run: node automation/orchestrator/plan.mjs --issue "${{ github.event.issue.number }}"

      # エージェントは git を持たない（settings の Bash 許可リストに無い）。
      # 永続化は例外なく機械側に寄せる。
      - name: PM の編集と state をコミット・push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PATHS="TASKS.md QUESTIONS.md LOOP_LOG.md automation/state"
          if git diff --quiet -- $PATHS && [ -z "$(git ls-files --others --exclude-standard -- $PATHS)" ]; then
            echo "変更なし"
            exit 0
          fi
          git add $PATHS
          git commit -m "docs: 計画フェーズによる TASKS.md／QUESTIONS.md／state の更新 (Issue #${{ github.event.issue.number }})"
          # エージェントのステップを経由すると checkout の認証情報が失われるため張り直す。
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # 台帳は main へ直接 push するが、計画フェーズは Issue ごとに並列で走る
          # （concurrency.group が `auto-plan-<issue番号>`／設計 §10.10.3）。
          # 同時に追記が走ると rebase が競合するため、次の2段で受け止める。
          #   1. `.gitattributes` の `merge=union` が、追記どうしの競合を自動解決する
          #   2. それでも解決できなければ rebase を中断し、次の試行へ回す
          #      （中断しないと .git/rebase-merge が残り、以後の git 操作が全部失敗する）
          #
          # 2026-09-15: この中断が無かったため、5件同時実行で計画フェーズが連鎖的に
          # 失敗し、ラベルが `auto:planning` のまま24時間放置された。
          pushed=false
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then pushed=true; break; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::warning::rebase が競合したため中断した（試行 $i）"
            fi
            sleep $((i * 3))
          done
          if [ "$pushed" != true ]; then
            echo "::error::台帳の push が5回とも失敗した。同時実行数を減らすこと（設計 §10.10.3）"
            exit 1
          fi

  # ── 停止: 事由で行き先を分ける（2026-09-16 改訂）─────────────
  #
  # 旧版は停止をすべて `auto:blocked` へ潰していた。そのため
  #   ・仕様が未確定（オーナー判断が要る）
  #   ・クレジット切れ・SDK の一時障害（時間をおけば直る）
  # が同じ見た目になり、**人を呼ぶ必要がないものまで人を待って止まった**。
  # 実例: Issue #31 は「You've hit your session limit」で停止したが、
  # 仕様の質問と同じラベルが付いたため、誰も気づかないまま滞留した。
  blocked:
    needs: plan
    if: always() && needs.plan.outputs.blocked == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 停止事由に応じてラベルを付け替え、通知する
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          KIND: ${{ needs.plan.outputs.blocked_kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # spec         → auto:blocked  オーナー判断が要る。枯渇レポートに載る
          # infra/credit → auto:retry    スイーパーが時間をおいて自動再開する
          KIND="${KIND:-spec}"
          if [ "$KIND" = "spec" ]; then
            NEW_LABEL="auto:blocked"
          else
            NEW_LABEL="auto:retry"
          fi
          gh issue edit "$ISSUE" --repo "$REPO" \
            --remove-label "auto:planning" --add-label "$NEW_LABEL"

          # 2026-09-25 新設: オーナー判断待ちだけ件名に🔴を付け、通知の件名一覧だけで
          # 「要判断」と分かるようにする（自動再試行 auto:retry には付けない・冪等）。
          if [ "$NEW_LABEL" = "auto:blocked" ]; then
            TITLE="$(gh issue view "$ISSUE" --repo "$REPO" --json title --jq .title)"
            case "$TITLE" in
              "🔴[要判断] "*) : ;;
              *) gh issue edit "$ISSUE" --repo "$REPO" --title "🔴[要判断] ${TITLE}" ;;
            esac
          fi

          if [ "$NEW_LABEL" = "auto:retry" ]; then
            cat > notice.md <<'EOF'
          ## ⏳ 一時的な事由で停止しました

          エージェントの判断でも仕様の問題でもありません。**オーナーの操作は不要です。**
          スイーパー（`auto-05-sweep.yml`）が時間をおいて自動で再開します。

          <!--retry:from=auto-->
          EOF
            printf '\n事由: `%s`\n実行: %s\n' "$KIND" "$RUN_URL" >> notice.md
          else
            cat > notice.md <<'EOF'
          @OWNER_PLACEHOLDER 仕様が未確定のため停止しました。**オーナーの判断が要ります。**

          **再開の手順（この2つを両方行ってください）**

          1. 上のコメントの選択肢への回答を、この Issue にコメントする
          2. そのうえで **`auto:blocked` を外し、`auto` ラベルを付け直す**

          > ⚠️ **コメントだけでは再開しません。** Issue へのコメントはワークフローを起動しません。
          > 再開の引き金はラベルが「付いた」ことだけです。既に付いている場合は、
          > 一度外してから付け直してください。
          >
          > この項目は、着手可能な仕事が尽きた時点で**枯渇レポート**にまとめて報告されます。

          実行: RUN_URL_PLACEHOLDER
          EOF
            sed -i "s|@OWNER_PLACEHOLDER|@${OWNER}|; s|RUN_URL_PLACEHOLDER|${RUN_URL}|" notice.md
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body-file notice.md
  # ── リスク区分の通知と、異議申立ての窓（設計 §4.1 改訂 2026-09-16）──
  #
  # 旧版はここに ゲート1（gate-task-definition／高リスク）と
  # ゲート2（gate-task-plan／高・中）の2つの承認ジョブを置き、
  # さらに低リスクには 30分の Wait timer（gate-low-risk-objection）を挟んでいた。
  #
  # ── なぜ撤去したか（2026-09-16 オーナー決定）────────────────
  # 計画フェーズの承認待ちは、オーナーが不在の間ループ全体を止める。
  # 実測で 9件中8件が高リスク判定であり（§4.1 の判定条件が
  # 認可・金額・個人情報・DBマイグレーションを列挙する一方、Phase 1 は
  # まさに認証基盤と DB 基盤を作る段階であるため）、事実上すべての
  # タスクが2回の承認待ちに入っていた。
  #
  # 承認は **マージ前の1回（ゲート3）だけ** に集約する。
  # 根拠: 設計 §0 が「ループは docs/spec/ に既に確定している仕様を
  # 実装するだけ」と定めている以上、仕様が確定しているタスクの
  # 計画・実装は判断ではなく作業であり、誤りは CI・レビュー3種・
  # RLS テストで検出できる。判断が要るのは「未確定の論点が残っている」
  # 場合であり、それは blocked 側（§3.2）で扱う。
  #
  # ── 異議申立ての窓は残す（形を変えて）──────────────────────
  # §4.1 の「異議申立ての窓を持たない自動通過は認めない」は維持する。
  # ただし **時間で待たない**。リスク区分を通知し、オーナーはマージ前まで
  # いつでも `auto:needs-review` を付けて強制的にゲート3へ送れる。
  # 30分の壁時計を消費せずに、異議の機会は実質的に広がる。
  notify-classification:
    needs: plan
    if: needs.plan.outputs.blocked == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: リスク区分と異議申立ての方法を通知
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RISK: ${{ needs.plan.outputs.risk }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$RISK" = "high" ]; then
            GATE='**マージ前（ゲート3）で承認を求めます。** 計画・実装・レビューはここから自動で進みます。'
            # 2026-09-25 新設: 高リスクは後でゲート3の承認待ちになる。
            # 承認待ちになってから気づくと後手に回るため、分類の時点で先に呼ぶ。
            MENTION="@${OWNER} "
          else
            GATE='**承認なしでマージまで進みます。**（リスク区分が高以外のため・設計 §4.1 改訂）'
            MENTION=""
          fi
          {
            printf '%s計画フェーズが完了しました。リスク区分: **%s**\n\n' "$MENTION" "$RISK"
            printf '%s\n\n' "$GATE"
            printf '%s\n' '> [!note] 異議がある場合'
            printf '%s\n' '> `auto:needs-review` ラベルを付けてください。**マージ前であればいつでも有効**で、'
            printf '%s\n' '> 区分にかかわらずゲート3（`gate-merge`）での承認が必須になります。'
            printf '%s\n' '> 計画を丸ごと止めたい場合は `auto:blocked` を付けてください。'
            printf '\n実行: %s\n' "$RUN_URL"
          } > notice.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file notice.md

  # ── 次フェーズへ引き渡し ────────────────────────────────────
  handoff:
    needs: [plan, notify-classification]
    if: >-
      always()
      && needs.plan.result == 'success'
      && needs.plan.outputs.blocked == 'false'
      && needs.notify-classification.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: ラベルを auto:approved に付け替え
        env:
          # PAT でないと次のワークフローが起動しない（設計 §8.1）。
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$REPO" \
            --remove-label "auto:planning" --add-label "auto:approved"
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "auto:low-risk" || true
